/* Alleen schermpassing: schaal de complete TTO-pagina zonder inhoud af te snijden. */
html,body{width:100%;height:100%;min-height:0;overflow:hidden}
body{display:block}
.shell{position:fixed;left:0;top:0;width:360px;max-width:none;height:auto;
  min-height:780px;max-height:none;aspect-ratio:auto;margin:0;
  overflow:visible;transform-origin:top left}
.card.challenge-card{flex:1 0 auto;min-height:0;overflow:visible!important}

</style>
</head>
<body>
<main class="shell">
  <div class="top">
    <a class="logo" href="index.html">
      <img src="ter-aa-logo.png" alt="Ter AA">
      <div class="step">5 van 5</div>
    </a>
    <div class="step">BILINGUAL ICT</div>
  </div>

  <section class="card challenge-card" id="card">
    <div class="chapter-head">
      <div class="chapter-kicker"><span>🌍</span><span class="flagline">Dutch + English</span></div>
      <h1>International ICT Challenge</h1>
    </div>

    <div class="challenge-progress">
      <div class="progress"><span id="bar"></span></div>
      <div class="counter" id="counter">1 / 8</div>
    </div>

    <div id="story" class="challenge-story"></div>
    <div id="question" class="challenge-question"></div>
    <div id="dynamic"></div>
    <div id="feedback" class="feedback challenge-feedback"></div>
    <button id="next" class="primary" hidden>Volgende →</button>
  </section>

  <div class="footer">ICT College · Ter AA</div>
</main>

<script>
const items = [{"type": "mc", "story": "Noor vertelt over de tweetalige ICT-route. Je krijgt dezelfde vakinhoud als bij de Nederlandstalige variant, maar een groot deel van de opleiding is in het Engels.", "q": "Welke uitspraak klopt?", "answers": ["Alle lessen zijn volledig in het Engels.", "Ruim de helft van de lessen is in het Engels en ook lesmateriaal en toetsing zijn deels Engelstalig.", "Alleen het vak Engels is anders."], "correct": 1, "good": "Juist. De opleiding blijft dezelfde vakopleiding, maar ruim de helft van de lessen, het materiaal en de toetsing is in het Engels.", "bad": "Kijk vooral naar het verschil tussen 'alles in het Engels' en 'ruim de helft in het Engels'."}, {"type": "mc", "story": "Binnen ICT zijn er drie opleidingen die je ook tweetalig kunt volgen.", "q": "Welke combinatie bestaat echt bij Ter AA?", "answers": ["Software engineer, Full stack developer en Game developer", "Cyber security specialist, Network specialist en Cloud specialist", "ICT support technician, Medewerker ICT en Network specialist"], "correct": 0, "good": "Precies. Deze drie software-opleidingen hebben een Nederlandstalige én tweetalige variant.", "bad": "Denk aan de drie opleidingen binnen Software development die ook als tweetalige variant op de ICT-pagina staan."}, {"type": "mc", "story": "Je werkt samen met een buitenlandse student. Die schrijft: “I found a bug in the login screen. Can you reproduce the issue?”", "q": "Wat vraagt deze student eigenlijk?", "answers": ["Of jij de fout ook kunt laten optreden", "Of jij het wachtwoord kunt resetten", "Of jij een nieuwe loginpagina wilt ontwerpen"], "correct": 0, "good": "Ja. 'Reproduce the issue' betekent controleren of jij dezelfde fout opnieuw kunt laten gebeuren.", "bad": "Het woord 'reproduce' betekent hier niet namaken van de hele applicatie, maar dezelfde fout opnieuw laten optreden."}, {"type": "mc", "story": "Een internationale opdrachtgever stuurt: “Please deploy the new version after testing.”", "q": "Wat moet je doen?", "answers": ["De nieuwe versie eerst verwijderen en daarna testen", "De nieuwe versie na het testen beschikbaar maken", "De nieuwe versie alleen naar jezelf mailen"], "correct": 1, "good": "Goed. In ICT betekent 'deploy' dat je software uitrolt of beschikbaar maakt.", "bad": "Let op het vakwoord 'deploy': dat betekent uitrollen of beschikbaar maken."}, {"type": "mc", "story": "Je zit in een online meeting met studenten uit een ander land. Iemand vraagt: “What are you working on today?”", "q": "Welke reactie klinkt het meest professioneel?", "answers": ["I do computer things.", "Yes.", "I’m testing the login page and fixing two small bugs."], "correct": 2, "good": "Juist. Kort, duidelijk en specifiek: precies wat je in een internationale stand-up wilt horen.", "bad": "Een goede update zegt kort wat je doet en waar je mee bezig bent."}, {"type": "text", "story": "Nu ben jij aan de beurt. Je teamgenoot uit Ierland vraagt: “What is the problem?”", "q": "Schrijf in het Engels één korte uitleg van een ICT-probleem.", "placeholder": "Bijvoorbeeld: The website does not load on my laptop...", "minWords": 7, "keywords": ["not", "does", "problem", "error", "work", "working", "load", "connect", "login", "screen", "website", "computer", "laptop"], "minKeywords": 1, "hints": ["Begin bijvoorbeeld met: “The ... does not ...”", "Noem het apparaat of de software én wat er fout gaat.", "Voorbeeld: “The login page does not load on my laptop.”"], "success": "Mooi. Dat is duidelijk genoeg om aan een internationale collega uit te leggen wat er misgaat."}, {"type": "text", "story": "Bij tweetalig onderwijs gaat het niet alleen om Engels spreken. Je werkt ook internationaal en kunt te maken krijgen met een buitenlandse stage of uitwisseling.", "q": "Schrijf in het Engels een korte update aan je team: wat heb je gedaan en wat ga je daarna doen?", "placeholder": "Today I tested... Next I will...", "minWords": 10, "keywords": ["today", "tested", "made", "fixed", "next", "will", "tomorrow", "working", "finished", "build", "test"], "minKeywords": 2, "hints": ["Gebruik twee delen: wat je vandaag deed + wat je hierna gaat doen.", "Start bijvoorbeeld met “Today I…” en daarna “Next I will…”", "Voorbeeld: “Today I tested the website. Next I will fix the login screen.”"], "success": "Goed. Zo’n korte update past goed bij samenwerken in een internationaal ICT-team."}, {"type": "final", "story": "Laatste opdracht. Kies welke tweetalige richting jou het meest aanspreekt en leg kort uit waarom.", "q": "Maak jouw mini-pitch in het Engels.", "choices": ["Software engineer", "Full stack developer", "Game developer"], "minWords": 8, "hints": ["Begin met: “I would choose…”", "Vertel daarna wat je leuk vindt: programming, websites, games, design of solving problems.", "Voorbeeld: “I would choose Game developer because I like programming and creating games.”"]}];
let current = 0;
let attempts = 0;
let selectedRoute = "";

const story = document.getElementById("story");
const question = document.getElementById("question");
const dynamic = document.getElementById("dynamic");
const feedback = document.getElementById("feedback");
const next = document.getElementById("next");
const bar = document.getElementById("bar");
const counter = document.getElementById("counter");

function norm(s){
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9\s']/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function words(s){
  return norm(s).split(" ").filter(w => w.length > 1);
}

function render(){
  attempts = 0;
  selectedRoute = "";
  feedback.textContent = "";
  next.hidden = true;
  dynamic.innerHTML = "";

  if(current >= items.length){
    bar.style.width = "100%";
    counter.textContent = "8 / 8";
    story.textContent = "";
    question.textContent = "";
    dynamic.innerHTML = `
      <div class="done-screen">
        <div class="big">🌍🎓</div>
        <h2>International challenge completed!</h2>
        <p>Je hebt geproefd aan vaktaal, samenwerken en communiceren in het Engels. Dat is precies waar tweetalig ICT extra op inzet.</p>
        <div class="codebox" style="margin:8px 0 10px">
          <div>Jouw vijfde cijfer</div>
          <div class="digit">6</div>
        </div>
        <a class="primary" href="finale.html">Ga naar de finale →</a>
      </div>`;
    return;
  }

  const x = items[current];
  bar.style.width = ((current / items.length) * 100) + "%";
  counter.textContent = `${current+1} / ${items.length}`;
  story.textContent = x.story;
  question.textContent = x.q;

  if(x.type === "mc"){
    const wrap = document.createElement("div");
    wrap.className = "choices challenge-choices";
    x.answers.forEach((a,i) => {
      const b = document.createElement("button");
      b.className = "choice";
      b.textContent = a;
      b.onclick = () => checkMc(i,b);
      wrap.appendChild(b);
    });
    dynamic.appendChild(wrap);
  }

  if(x.type === "text"){
    dynamic.innerHTML = `
      <div class="word-bank">
        <span>problem</span><span>working</span><span>test</span><span>next</span><span>website</span><span>login</span>
      </div>
      <textarea id="answerText" placeholder="${x.placeholder}"></textarea>`;
    next.textContent = "Controleer mijn antwoord";
    next.hidden = false;
    next.onclick = checkText;
  }

  if(x.type === "final"){
    const picks = document.createElement("div");
    picks.className = "route-picks";
    x.choices.forEach(c => {
      const b = document.createElement("button");
      b.className = "route-pick";
      b.textContent = c;
      b.onclick = () => {
        selectedRoute = c;
        document.querySelectorAll(".route-pick").forEach(p => p.classList.remove("selected"));
        b.classList.add("selected");
      };
      picks.appendChild(b);
    });
    dynamic.appendChild(picks);

    const ta = document.createElement("textarea");
    ta.id = "answerText";
    ta.placeholder = "I would choose ... because ...";
    dynamic.appendChild(ta);

    next.textContent = "Check mijn mini-pitch";
    next.hidden = false;
    next.onclick = checkFinal;
  }
}

function checkMc(i,b){
  const x = items[current];
  if(i === x.correct){
    b.classList.add("good");
    feedback.textContent = "✅ " + x.good;
    document.querySelectorAll(".choice").forEach(btn => btn.disabled = true);
    next.textContent = "Volgende →";
    next.hidden = false;
    next.onclick = advance;
  } else {
    b.classList.add("bad");
    feedback.textContent = "Nog niet. " + x.bad + " Probeer opnieuw.";
  }
}

function hintFor(x){
  const index = Math.min(attempts-1, x.hints.length-1);
  return x.hints[index];
}

function checkText(){
  attempts++;
  const x = items[current];
  const raw = document.getElementById("answerText").value.trim();
  const ws = words(raw);
  const n = norm(raw);
  const matches = x.keywords.filter(k => n.includes(norm(k))).length;

  if(ws.length < x.minWords || matches < x.minKeywords){
    if(attempts >= 3 && ws.length >= Math.max(5,x.minWords-3)){
      feedback.textContent = "👍 Dit is voldoende. Vergelijk jullie zin nog even met de hint en ga door.";
      next.textContent = "Volgende →";
      next.onclick = advance;
      return;
    }
    feedback.textContent = "💡 " + hintFor(x);
    return;
  }

  feedback.textContent = "✅ " + x.success;
  next.textContent = "Volgende →";
  next.onclick = advance;
}

function checkFinal(){
  attempts++;
  const x = items[current];
  const raw = document.getElementById("answerText").value.trim();
  const ws = words(raw);

  if(!selectedRoute){
    feedback.textContent = "💡 Kies eerst één van de drie tweetalige richtingen.";
    return;
  }

  if(ws.length < x.minWords){
    feedback.textContent = "💡 " + hintFor(x);
    if(attempts >= 3 && ws.length >= 5){
      feedback.textContent = "👍 Prima. Je keuze en uitleg zijn duidelijk genoeg.";
      next.textContent = "Afronden →";
      next.onclick = advance;
    }
    return;
  }

  feedback.textContent = "✅ Nice! Je hebt een duidelijke keuze gemaakt én die in het Engels uitgelegd.";
  next.textContent = "Afronden →";
  next.onclick = advance;
}

function advance(){
  current++;
  render();
}

render();
</script>
<script>
(() => {
  const page = document.querySelector('.shell');
  let frame;
  function fitPage() {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      const view = window.visualViewport;
      const width = view ? view.width : document.documentElement.clientWidth;
      const height = view ? view.height : document.documentElement.clientHeight;
      const inset = 8;
      const naturalWidth = page.offsetWidth;
      const naturalHeight = Math.max(page.offsetHeight, page.scrollHeight);
      const scale = Math.min((width - inset * 2) / naturalWidth,
                             (height - inset * 2) / naturalHeight, 1.35);
      page.style.transform = `scale(${Math.max(0.1, scale)})`;
      page.style.left = `${(view ? view.offsetLeft : 0) + (width - naturalWidth * scale) / 2}px`;
      page.style.top = `${(view ? view.offsetTop : 0) + (height - naturalHeight * scale) / 2}px`;
    });
  }
  window.addEventListener('resize', fitPage);
  window.addEventListener('pageshow', fitPage);
  window.addEventListener('load', fitPage);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', fitPage);
    visualViewport.addEventListener('scroll', fitPage);
  }
  new ResizeObserver(fitPage).observe(page);
  // Pas ook opnieuw na antwoordfeedback, hints en het wisselen van opdracht.
  new MutationObserver(fitPage).observe(document.getElementById('card'), {
    childList: true, subtree: true, characterData: true, attributes: true
  });
  if (document.fonts) document.fonts.ready.then(fitPage);
  fitPage();
})();
</script>
</body>
