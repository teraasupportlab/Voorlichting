<script>
const items = [["Noor heeft een kleine robot klaargezet voor de open dag. De robot moet zelfstandig naar een sleutel rijden. Hij doet precies wat jij programmeert — niet wat jij bedoelt.", "Wat moet je doen vóór je commando's gaat geven?", ["Eerst bepalen waar de robot staat, waar het doel is en welke obstakels er zijn", "Meteen zoveel mogelijk commando's invoeren", "De robot eerst opnieuw opstarten"], 0, "Een programmeur begint met het probleem begrijpen: startpunt, doel en beperkingen."], ["De robot staat voor een muur. Je programma zegt alleen: 'ga vooruit'.", "Welke oplossing maakt het programma slimmer?", ["De snelheid van de robot verlagen", "Een voorwaarde toevoegen: als er een muur is, kies een andere richting", "Het commando 'vooruit' drie keer herhalen"], 1, "Met een voorwaarde kan het programma verschillend reageren op verschillende situaties."], ["ROBOT", "Breng de robot naar de sleutel", ["Gebruik de pijltjes om een reeks commando's te bouwen. Druk daarna op Uitvoeren. Raak geen muur."], 0, ""], ["Je merkt dat de robot dezelfde beweging vier keer achter elkaar moet uitvoeren.", "Welke programmeerconstructie is hiervoor het meest geschikt?", ["Een variabele", "Een foutmelding", "Een lus"], 2, "Een lus herhaalt één of meer instructies zonder dat je ze steeds opnieuw hoeft te schrijven."], ["Je programma ziet er logisch uit, maar de robot komt toch op de verkeerde plek uit.", "Wat is de beste manier om de fout te vinden?", ["De commando's stap voor stap uitvoeren en kijken waar het gedrag afwijkt", "Alle code wissen en helemaal opnieuw beginnen", "Steeds willekeurig één commando veranderen"], 0, "Debuggen betekent systematisch testen waar het programma iets anders doet dan je verwacht."], ["TASK", "Schrijf een mini-algoritme", ["Schrijf in gewone taal minimaal vier duidelijke stappen waarmee een robot vanaf een stoel naar de deur kan lopen. De stappen moeten zo precies zijn dat iemand anders ze zonder uitleg kan uitvoeren."], 0, ""], ["Je programma werkt alleen als er niets in de weg staat. Noor wil dat de robot ook met een obstakel kan omgaan.", "Wat moet je toevoegen?", ["Meer commentaarregels", "Een voorwaarde die controleert of de route vrij is", "Een langere naam voor het programma"], 1, "Met een voorwaarde kan het programma een andere actie kiezen wanneer de situatie verandert."], ["De robot bereikt de sleutel. Noor zegt: 'Mooi, klaar!'", "Wat hoort een programmeur nog te doen voordat het programma echt klaar is?", ["De code alleen nog mooier opmaken", "Het programma op één computer bewaren", "Het programma met meerdere situaties testen"], 2, "Eén succesvolle test is niet genoeg. Goede software wordt met verschillende situaties en invoer getest."]];
const digit = "7";
const nextFile = "05-TTO.html";
const nextLabel = "Naar TTO";
let current = 0;

const number = document.getElementById("number");
const story = document.getElementById("story");
const question = document.getElementById("question");
const choices = document.getElementById("choices");
const feedback = document.getElementById("feedback");
const taskarea = document.getElementById("taskarea");
const next = document.getElementById("next");
const progress = document.getElementById("progress");


const taskAttempts = {};
const taskRules = {
  5: {
    minWords: 12,
    helperWords: ["stap", "vooruit", "links", "rechts", "deur", "lopen", "draai", "stoel"],
    minHelpers: 2
  }
};

function normalizeText(value){
  return value
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9?\s-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function wordList(value){
  return normalizeText(value)
    .replace(/\?/g, " ")
    .split(/\s+/)
    .filter(w => w.length >= 2);
}

function validateTask(){
  const area = taskarea.querySelector("textarea");
  const raw = area ? area.value.trim() : "";
  const text = normalizeText(raw);
  const words = wordList(raw);
  const rule = taskRules[current] || { minWords: 8, helperWords: [], minHelpers: 0 };

  taskAttempts[current] = (taskAttempts[current] || 0) + 1;
  const attempt = taskAttempts[current];

  function hint(){
    if(attempt === 1){
      return " Hint 1: schrijf echt losse stappen, bijvoorbeeld eerst opstaan, draaien en daarna lopen.";
    }
    if(attempt === 2){
      return " Hint 2: gebruik richtingen en aantallen, bijvoorbeeld 'draai rechts' of 'loop drie stappen vooruit'.";
    }
    return " Hint 3: voorbeeldrichting: '1. Sta op. 2. Draai naar rechts. 3. Loop vier stappen vooruit. 4. Stop bij de deur.'";
  }

  if(words.length < rule.minWords){
    feedback.textContent = `Schrijf nog iets meer: ongeveer ${rule.minWords} echte woorden is genoeg.` + hint();
    area && area.focus();
    return;
  }

  const matches = (rule.helperWords || []).filter(term => text.includes(normalizeText(term))).length;
  if(matches < (rule.minHelpers || 0)){
    if(attempt >= 3){
      feedback.textContent = "Dit is voldoende om verder te gaan. Vergelijk jullie stappen nog even met de hint.";
      setTimeout(advance, 650);
      return;
    }
    feedback.textContent = "De stappen zijn nog niet precies genoeg voor een robot." + hint();
    area && area.focus();
    return;
  }

  feedback.textContent = "Prima. Deze instructies zijn duidelijk genoeg om verder te gaan.";
  setTimeout(advance, 350);
}


let robotCommands = [];
let robotAttempts = 0;

const robotWalls = new Set(["0,2","1,0","1,2","3,1"]);
const robotGoal = [3,3];
const robotStart = [0,0];

function renderRobotTask(){
  robotCommands = [];
  robotAttempts = 0;
  document.querySelector(".card").classList.add("robot-active");

  story.textContent = "Robot linksboven • sleutel rechtsonder";
  question.textContent = "Programmeer de route zonder een muur te raken.";
  choices.innerHTML = "";
  feedback.textContent = "";

  taskarea.innerHTML = `
    <div class="robot-task">
      <div class="maze" id="maze"></div>
      <div class="robot-side">
        <div class="program" id="program">Nog geen commando's.</div>

        <div class="robot-controls">
          <button class="smallbtn robot-control" type="button" onclick="addRobotCmd('↑')">↑ Omhoog</button>
          <button class="smallbtn robot-control" type="button" onclick="addRobotCmd('↓')">↓ Omlaag</button>
          <button class="smallbtn robot-control" type="button" onclick="addRobotCmd('←')">← Links</button>
          <button class="smallbtn robot-control" type="button" onclick="addRobotCmd('→')">→ Rechts</button>
        </div>

        <div class="robot-actions">
          <button class="smallbtn robot-control" type="button" onclick="undoRobotCmd()">↶ Wis</button>
          <button class="smallbtn robot-control" type="button" onclick="runRobot()">▶ Uitvoeren</button>
        </div>

        <div class="robot-hint">Max. 12 commando's. De robot voert ze straks één voor één uit.</div>
      </div>
    </div>
  `;

  drawMaze(robotStart[0], robotStart[1]);
}

function drawMaze(rr, cc, bumpCell=null){
  const maze = document.getElementById("maze");
  if(!maze) return;

  maze.innerHTML = "";

  for(let r=0;r<4;r++){
    for(let c=0;c<4;c++){
      const cell = document.createElement("div");
      cell.className = "cell";

      if(robotWalls.has(`${r},${c}`)){
        cell.classList.add("wall");
        cell.textContent = "🧱";
        cell.setAttribute("aria-label","muur");
      }

      if(r===robotGoal[0] && c===robotGoal[1]){
        cell.classList.add("goal");
        cell.textContent = "🔑";
      }

      if(r===rr && c===cc){
        cell.classList.add("robot","robot-moving");
        cell.textContent = "🤖";
      }

      if(bumpCell && r===bumpCell[0] && c===bumpCell[1]){
        cell.classList.add("bump");
      }

      maze.appendChild(cell);
    }
  }
}

function updateProgram(){
  const p = document.getElementById("program");
  if(p){
    p.textContent = robotCommands.length
      ? robotCommands.join("  ")
      : "Nog geen commando's.";
  }
}

function addRobotCmd(cmd){
  if(robotCommands.length >= 12){
    feedback.textContent = "Maximaal 12 commando's. Wis er één of voer de route uit.";
    return;
  }
  robotCommands.push(cmd);
  updateProgram();
}

function undoRobotCmd(){
  robotCommands.pop();
  updateProgram();
}

function setRobotControlsDisabled(disabled){
  document.querySelectorAll(".robot-control").forEach(b => b.disabled = disabled);
}

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function runRobot(){
  if(!robotCommands.length){
    feedback.textContent = "Voeg eerst een paar pijltjes toe.";
    return;
  }

  robotAttempts++;
  setRobotControlsDisabled(true);
  feedback.textContent = "De robot voert jullie programma uit…";

  let r = robotStart[0], c = robotStart[1];
  let hitWall = false;

  drawMaze(r,c);
  await sleep(450);

  for(const cmd of robotCommands){
    let nr=r, nc=c;

    if(cmd==="↑") nr--;
    if(cmd==="↓") nr++;
    if(cmd==="←") nc--;
    if(cmd==="→") nc++;

    const outside = nr<0 || nr>3 || nc<0 || nc>3;
    const wall = !outside && robotWalls.has(`${nr},${nc}`);

    if(outside || wall){
      hitWall = true;
      drawMaze(r,c, wall ? [nr,nc] : null);
      feedback.textContent = wall
        ? "Bots! De robot rijdt tegen een muur."
        : "De robot probeert buiten het speelveld te rijden.";
      await sleep(550);
      break;
    }

    r=nr;
    c=nc;
    drawMaze(r,c);
    await sleep(480);
  }

  if(!hitWall && r===robotGoal[0] && c===robotGoal[1]){
    feedback.textContent = "Gelukt! 🤖🔑 De robot heeft de sleutel bereikt.";
    document.querySelectorAll(".robot-control").forEach(b => b.hidden = true);
    const hint = document.querySelector(".robot-hint");
    if(hint) hint.textContent = "Mooi geprogrammeerd. Ga door naar het volgende onderdeel.";
    next.textContent = "Volgende";
    next.hidden = false;
    next.onclick = advance;
    return;
  }

  setRobotControlsDisabled(false);

  if(robotAttempts === 1){
    feedback.textContent += " Hint: kijk vanaf elk vak opnieuw welke richting vrij is.";
  } else if(robotAttempts === 2){
    feedback.textContent += " Hint 2: de route begint met → en daarna ↓.";
  } else {
    feedback.textContent += " Hint 3: probeer → ↓ ↓ → → ↓.";
  }
}

function render(){
  document.querySelector(".card").classList.remove("robot-active");
  progress.style.width = ((current / items.length) * 100) + "%";
  feedback.textContent = "";
  taskarea.innerHTML = "";
  choices.innerHTML = "";
  next.hidden = true;

  if(current >= items.length){
    progress.style.width = "100%";
    number.textContent = "Hoofdstuk afgerond";
    story.innerHTML = "Bewaar dit cijfer voor de eindcode.";
    question.textContent = "";
    choices.innerHTML = "";
    feedback.textContent = "";
    taskarea.innerHTML = `<div class="codebox"><div>Jouw cijfer</div><div class="digit">${digit}</div></div>`;
    next.textContent = nextLabel;
    next.hidden = false;
    next.onclick = () => location.href = nextFile;
    return;
  }

  const x = items[current];
  number.textContent = `Onderdeel ${current+1} van ${items.length}`;

  if(x[0] === "ROBOT"){
    renderRobotTask();
    return;
  }

  if(x[0] === "TASK"){
    story.textContent = "Jullie opdracht";
    question.textContent = x[1];
    taskarea.innerHTML = `<textarea placeholder="Schrijf hier jullie antwoord..." aria-label="Jullie antwoord"></textarea>`;
    const note = document.createElement("div");
    note.className = "note";
    note.style.marginTop = "10px";
    note.textContent = x[2][0];
    taskarea.appendChild(note);
    next.textContent = "Controleer antwoord";
    next.hidden = false;
    next.onclick = validateTask;
    return;
  }

  story.textContent = x[0];
  question.textContent = x[1];

  x[2].forEach((answer, idx) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = answer;
    b.onclick = () => checkAnswer(idx, b);
    choices.appendChild(b);
  });
}

function checkAnswer(idx, button){
  const x = items[current];
  if(idx === x[3]){
    button.classList.add("good");
    feedback.textContent = "Goed. " + x[4];
    [...choices.children].forEach(b => b.disabled = true);
    next.textContent = "Volgende";
    next.hidden = false;
    next.onclick = advance;
  } else {
    button.classList.add("bad");
    feedback.textContent = "Nog niet. " + x[4] + " Probeer dezelfde vraag opnieuw.";
  }
}

function advance(){
  current++;
  render();
}

render();
</script>
<script>
(() => {
  const page = document.querySelector('.shell');
  let frame;
  function fitPage() {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      const view = window.visualViewport;
      const width = view ? view.width : document.documentElement.clientWidth;
      const height = view ? view.height : document.documentElement.clientHeight;
      const inset = 8;
      const naturalWidth = page.offsetWidth;
      const naturalHeight = Math.max(page.offsetHeight, page.scrollHeight);
      const scale = Math.min((width - inset * 2) / naturalWidth,
                             (height - inset * 2) / naturalHeight, 1.35);
      page.style.transform = `scale(${Math.max(0.1, scale)})`;
      page.style.left = `${(view ? view.offsetLeft : 0) + (width - naturalWidth * scale) / 2}px`;
      page.style.top = `${(view ? view.offsetTop : 0) + (height - naturalHeight * scale) / 2}px`;
    });
  }
  window.addEventListener('resize', fitPage);
  window.addEventListener('pageshow', fitPage);
  window.addEventListener('load', fitPage);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', fitPage);
    visualViewport.addEventListener('scroll', fitPage);
  }
  new ResizeObserver(fitPage).observe(page);
  // Meet opnieuw zodra feedback, opdrachten of opleidingsinformatie veranderen.
  new MutationObserver(fitPage).observe(page.querySelector('.card'), {
    childList: true, subtree: true, characterData: true, attributes: true
  });
  if (document.fonts) document.fonts.ready.then(fitPage);
  fitPage();
})();
</script>
</body>
</html>
