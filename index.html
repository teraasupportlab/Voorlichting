<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voorlichting | Ter AA ICT</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 540px;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #0b0e16;
    }
    body { padding: 0 10px 10px; }
    main {
      position: relative;
      width: min(1000px, 100%);
      height: 480px;
      margin: 50px auto 0;
      padding: 13px 24px;
      border: 2px solid #ff5900;
      border-radius: 20px;
      background: linear-gradient(125deg, #101b32 0%, #25324d 35%, #694039 70%, #b44d20 100%);
      box-shadow: 0 0 18px rgba(255, 89, 0, .25), inset 0 0 30px rgba(0, 0, 0, .3);
    }
    header { height: 62px; display: flex; justify-content: space-between; align-items: center; margin: 0 4px 12px; }
    .logo { max-height: 54px; width: auto; object-fit: contain; }
    .slogan { color: #ff5900; font-weight: 900; font-size: clamp(1.45rem, 3vw, 2.25rem); letter-spacing: .04em; text-shadow: 0 2px 9px #000, 0 0 13px rgba(255, 89, 0, .55); }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px 25px;
      align-items: start;
    }
    .card { --colour: #62d7ff; text-align: center; }
    .card a { display: inline-block; width: 100%; text-decoration: none; color: #fff; outline: none; }
    .image-wrap {
      position: relative;
      display: block;
      padding: 5px;
      border-radius: 17px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--colour) 75%, white), var(--colour));
      box-shadow: 0 0 12px var(--colour), 0 0 30px color-mix(in srgb, var(--colour) 68%, transparent), 0 0 60px color-mix(in srgb, var(--colour) 40%, transparent);
      transition: transform .24s ease, box-shadow .24s ease, filter .24s ease;
    }
    img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: #151925; }
    .name { display: block; margin-top: 8px; font-size: clamp(.9rem, 1.45vw, 1.12rem); font-weight: 800; letter-spacing: .025em; text-shadow: 0 2px 8px #000; }
    .card a:hover .image-wrap, .card a:focus-visible .image-wrap { transform: translateY(-8px) scale(1.025); filter: brightness(1.12); box-shadow: 0 0 16px var(--colour), 0 0 42px var(--colour), 0 0 80px color-mix(in srgb, var(--colour) 70%, transparent); }
    .card a:focus-visible .image-wrap { outline: 3px solid #fff; outline-offset: 6px; }
    .sigrid { --colour: #ff5900; }
    .connected { --colour: #9447f0; }
    .future { --colour: #27c6c1; }
    .senr { --colour: #2f80ed; }
    .greenpi { --colour: #90f87b; }
    .bootup { --colour: #fade29; }
    .firstline { --colour: #e53935; }
    .bpv { --colour: #546e7a; }
    .kilroy-window {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(250px, 60%);
      aspect-ratio: 1;
      overflow: hidden;
      pointer-events: none;
      z-index: 5;
    }
    .kilroy-window img {
      width: 100%;
      height: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      border-radius: 0;
      background: transparent;
    }
    @media (max-width: 700px) { .cards { grid-template-columns: repeat(2, minmax(135px, 1fr)); gap: 16px; } body { height: auto; min-height: 100vh; overflow: auto; } main { height: auto; min-height: 480px; padding: 13px 16px 22px; } }
  
    .heading { text-align: right; }
    .heading h1 { margin: 0 0 3px; font-size: 25px; }
    .heading .slogan { font-size: clamp(16px, 2.2vw, 24px); }
    @media (max-width: 700px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      main { margin-top: 18px; }
      .name { font-size: 14px; }
    }
  
    .coming { width: 100%; color: #fff; }
    .coming .image-wrap { opacity: .65; }
    .soon { display: block; margin-top: 5px; font-size: 12px; color: #f8df80; }
    @media (max-width: 700px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  
    .mode-toggle { position: absolute; right: 18px; bottom: 16px; z-index: 30; border: 1px solid #ff996e; border-radius: 24px; padding: 11px 18px; background: #17233a; color: white; font: bold 15px Arial,sans-serif; cursor: pointer; box-shadow: 0 0 15px #ff590055; }
    .mode-toggle[aria-pressed="true"] { background: #ff5900; color: #101010; }
    .mode-toggle:focus-visible, .qr-close:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .qr-modal { width: 95vw; height: 95dvh; max-width: none; max-height: none; padding: 18px; border: 2px solid #27c6c1; border-radius: 20px; background: #101b32; color: white; overflow: hidden; }
    .qr-modal::backdrop { background: #000b; }
    .qr-modal[open] { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
    .qr-modal h2 { margin: 0; font-size: clamp(20px,3vw,32px); text-align: center; padding: 0 45px; }
    .qr-modal .qr-large { display: block; width: min(74dvh,76vw,700px); height: min(74dvh,76vw,700px); aspect-ratio: 1; object-fit: contain; background: white; border-radius: 8px; flex-shrink: 1; min-height: 0; }
    .qr-modal p { margin: 0; font-size: 15px; text-align: center; }
    .qr-close { position: absolute; top: 10px; right: 12px; width: 42px; height: 42px; border: 1px solid #ffffff88; border-radius: 50%; background: #25324d; color: white; font-size: 28px; cursor: pointer; }
    body.qr-mode .cards a .image-wrap::after { content: none; position: absolute; right: 9px; bottom: 9px; padding: 5px 8px; border-radius: 6px; background: #101b32ee; color: white; font-size: 12px; font-weight: bold; }
    

    main { transition: border-color .22s ease, box-shadow .22s ease; }
    body.qr-mode main { border-color: #27e6dc; box-shadow: 0 0 24px #27e6dc80, inset 0 0 30px #27c6c11a; }
    .mode-toggle { display: inline-flex; align-items: center; gap: 8px; }
    .mode-toggle .qr-icon { width: 22px; height: 22px; }
    .mode-toggle[aria-pressed="true"] { background: #27e6dc; color: #08232a; border-color: #bafffa; box-shadow: 0 0 18px #27e6dc80; }
    .qr-badge { display: none; position: absolute; top: 10px; right: 10px; z-index: 2; width: 34px; height: 34px; padding: 5px; background: #092b33; color: #70fff2; border: 1px solid #70fff2; border-radius: 7px; box-shadow: 0 2px 8px #0008; }
    .qr-badge .qr-icon { display: block; width: 100%; height: 100%; }
    body.qr-mode .qr-badge { display: block; }
    body.qr-mode .cards a .image-wrap::after { content: none; }
.cards .image-wrap > img { aspect-ratio: 2.7 / 1; object-fit: contain; }
@media (max-width:700px) { main { padding-bottom:76px; } .cards .image-wrap > img { aspect-ratio: 16 / 9; } }
</style>
</head>

 const toggle = document.getElementById('qrToggle');
 const modal = document.getElementById('qrModal');
 const qrImage = document.getElementById('qrImage');
 let qrMode = false;
 let previousFocus = null;
 toggle.addEventListener('click', () => {
   qrMode = !qrMode;
   toggle.setAttribute('aria-pressed', String(qrMode));
   document.getElementById('qrToggleLabel').textContent = qrMode ? 'QR aan' : 'QR uit';
   document.body.classList.toggle('qr-mode', qrMode);
 });
 document.querySelectorAll('.cards a').forEach(link => {
   link.addEventListener('click', event => {
     if (!qrMode || !codes[link.getAttribute('href')]) return;
     event.preventDefault();
     const title = link.querySelector('.name').textContent;
     document.getElementById('qrTitle').textContent = title;
     qrImage.src = codes[link.getAttribute('href')];
     qrImage.alt = 'QR-code voor ' + title;
     previousFocus = link;
     modal.showModal();
     document.getElementById('qrClose').focus();
   });
 });
 document.getElementById('qrClose').addEventListener('click', () => modal.close());
 modal.addEventListener('click', event => { if (event.target === modal) modal.close(); });
 modal.addEventListener('close', () => { if (previousFocus) previousFocus.focus(); });
})();
</script>
