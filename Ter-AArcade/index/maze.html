@media(max-height:480px) and (min-width:481px){.touch{display:grid}.hint,.orb{display:none}.overlay{padding:8px}.overlay h2{font-size:19px;margin:0 0 6px}.overlay p{font-size:11px;line-height:1.4}.primary{padding:9px 15px}.touch button{height:34px}.screen{max-width:calc((100dvh - 110px)*.913)}}</style><main><section class="machine"><div class="hud"><div><label>PUNTEN</label><strong id="score" class="lime">00000</strong></div><div class="gamebrand">ter<span>AA</span> <small>MAZE</small></div><div><label>RECORD</label><strong id="best">00000</strong></div><div><label>LEVENS</label><strong id="lives" class="lime">● ● ●</strong></div></div><div class="screen"><canvas id="game" aria-label="Ter AA doolhofspel"></canvas><div class="overlay" id="overlay"><div><div class="orb"></div><h2 id="title">Ter AA Maze</h2><p id="message">Pak alle punten. Ontwijk de A’s.<br>Met een power-up pak jij hen!</p><button class="primary" id="start">Spelen →</button><p class="hint">PIJLTJES / WASD · SPATIE = PAUZE</p></div></div></div><div class="bottom"><a href="index.html" style="color:#c5f76a;text-decoration:none">← Ter AArcade</a> <span id="status">RONDE 01</span><div><button class="iconbtn" id="sound" data-arcade-sound>Geluid: aan</button> <button class="iconbtn" id="pause">Ⅱ Pauze</button></div></div><div class="touch"><button data-dir="3" aria-label="Omhoog">↑</button><button data-dir="2" aria-label="Links">←</button><button data-dir="1" aria-label="Omlaag">↓</button><button data-dir="0" aria-label="Rechts">→</button></div></section></main><script src="audio.js"></script><script>
const map=["#####################","#o........#........o#","#.###.###.#.###.###.#","#...................#","#.###.#.#####.#.###.#","#.....#...#...#.....#","###.#.###.#.###.#.###","#...#.....#.....#...#","#.#####.#.#.#.#####.#","#.......#...#.......#","#.###.#.##.##.#.###.#","#.....#.......#.....#","###.#.###.#.###.#.###","#...#.....#.....#...#","#.#####.#####.#####.#","#.........#.........#","#.###.###.#.###.###.#","#...#...........#...#","###.#.#.#####.#.#.###","#.....#...#...#.....#","#.#######.#.#######.#","#o.................o#","#####################"];
const C=32,W=21,H=23,canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),dirs=[[1,0],[0,1],[-1,0],[0,-1]],names=[];let score=0,best=0,lives=3,level=0,state='ready',dots=new Map(),total=0,player,enemies,power=0,invincible=0,last=0,particles=[],sound=false,audio;
try{best=+localStorage.getItem('teraa-maze-best')||0}catch(e){}document.getElementById('best').textContent=String(best).padStart(5,'0');
function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=W*C*d;canvas.height=H*C*d;ctx.setTransform(d,0,0,d,0,0)}resize();
const wall=(x,y)=>x<0||y<0||x>=W||y>=H||map[y][x]==='#';
function actor(x,y,color){return{x,y,fromX:x,fromY:y,toX:x,toY:y,t:1,dir:0,want:0,color}}
function resetActors(){player=actor(10,17,'#c5f76a');enemies=[actor(9,9,'#ff6997'),actor(10,9,'#73dbff'),actor(11,9,'#b68bff')];power=0;invincible=2}
function newLevel(){dots.clear();map.forEach((r,y)=>[...r].forEach((v,x)=>{if(v==='.'||v==='o')dots.set(x+','+y,v)}));dots.delete('10,17');total=dots.size;resetActors();update()}
function update(){document.getElementById('score').textContent=String(score).padStart(5,'0');document.getElementById('lives').textContent='● '.repeat(lives);if(score>best){best=score;try{localStorage.setItem('teraa-maze-best',best)}catch(e){}}document.getElementById('best').textContent=String(best).padStart(5,'0');document.getElementById('status').textContent=power>0?'POWER-UP · '+Math.ceil(power)+' SEC':'RONDE '+String(level+1).padStart(2,'0')}
function beep(f=600,d=.05){arcadeSound.tone(f,d)}
function burst(x,y,color){for(let i=0;i<12;i++)particles.push({x:x*C+C/2,y:y*C+C/2,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,life:.6,color})}
function collect(){let key=player.x+','+player.y,v=dots.get(key);if(!v)return;dots.delete(key);score+=v==='o'?50:10;if(v==='o'){power=8;burst(player.x,player.y,'#c5f76a');beep(900,.2)}else beep(500+score%150);update();if(!dots.size){arcadeSound.fx('win');level++;newLevel();state='next';show('Ronde '+(level+1),'Alle punten gepakt! De A’s worden sneller.','Verder →')}}
function move(a,dt,speed,isPlayer){if(a.t>=1){a.x=a.toX;a.y=a.toY;if(isPlayer){collect();if(state!=='playing')return;if(!wall(a.x+dirs[a.want][0],a.y+dirs[a.want][1]))a.dir=a.want;if(wall(a.x+dirs[a.dir][0],a.y+dirs[a.dir][1]))return}else{let choices=[0,1,2,3].filter(d=>!wall(a.x+dirs[d][0],a.y+dirs[d][1]));let nonrev=choices.filter(d=>d!==(a.dir+2)%4);if(nonrev.length)choices=nonrev;choices.sort((b,c)=>{let dist=d=>Math.hypot(a.x+dirs[d][0]-player.x,a.y+dirs[d][1]-player.y);return power?dist(c)-dist(b):dist(b)-dist(c)});a.dir=Math.random()<.22?choices[Math.floor(Math.random()*choices.length)]:choices[0]}a.fromX=a.x;a.fromY=a.y;a.toX=a.x+dirs[a.dir][0];a.toY=a.y+dirs[a.dir][1];a.t=0}a.t=Math.min(1,a.t+dt*speed)}
const pos=a=>({x:a.fromX+(a.toX-a.fromX)*a.t,y:a.fromY+(a.toY-a.fromY)*a.t});
function show(t,m,b){document.getElementById('title').textContent=t;document.getElementById('message').textContent=m;document.getElementById('start').textContent=b;document.getElementById('overlay').classList.remove('hidden')}
function start(){arcadeSound.unlock();if(['ready','over','win'].includes(state)){score=0;lives=3;level=0;newLevel()}state='playing';document.getElementById('overlay').classList.add('hidden');document.getElementById('pause').textContent='Ⅱ Pauze';last=performance.now()}
function pause(){if(state==='playing'){state='paused';show('Even pauze','Je studiepunten blijven netjes op je wachten.','Verder spelen →');document.getElementById('pause').textContent='▶ Verder'}else if(state==='paused')start()}
document.getElementById('start').onclick=start;document.getElementById('pause').onclick=pause;
function steer(d){player.want=d}addEventListener('keydown',e=>{let d={ArrowRight:0,ArrowDown:1,ArrowLeft:2,ArrowUp:3,d:0,s:1,a:2,w:3}[e.key];if(d!==undefined){e.preventDefault();steer(d)}if(e.code==='Space'){e.preventDefault();pause()}if(e.key==='Enter'&&state!=='playing')start()});document.querySelectorAll('[data-dir]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();steer(+b.dataset.dir)});let touchStart;canvas.addEventListener('touchstart',e=>{touchStart=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!touchStart)return;let dx=e.touches[0].clientX-touchStart[0],dy=e.touches[0].clientY-touchStart[1];if(Math.max(Math.abs(dx),Math.abs(dy))>15){steer(Math.abs(dx)>Math.abs(dy)?dx>0?0:2:dy>0?1:3);touchStart=null}},{passive:false});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(now){ctx.clearRect(0,0,W*C,H*C);let bg=ctx.createRadialGradient(336,340,0,336,340,550);bg.addColorStop(0,'#111b2d');bg.addColorStop(1,'#070c18');ctx.fillStyle=bg;ctx.fillRect(0,0,W*C,H*C);map.forEach((r,y)=>[...r].forEach((v,x)=>{if(v==='#'){ctx.fillStyle='#13263c';ctx.strokeStyle='#2f6380';ctx.lineWidth=1.1;ctx.shadowColor='#35b9db';ctx.shadowBlur=5;round(x*C+3,y*C+3,C-6,C-6,6);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#28496055';round(x*C+6,y*C+5,C-12,3,2);ctx.fill()}}));dots.forEach((v,key)=>{let[x,y]=key.split(',').map(Number);ctx.fillStyle=v==='o'?'#d3ff8d':'#c4db9c';ctx.shadowColor='#c5f76a';ctx.shadowBlur=v==='o'?14:4;ctx.beginPath();ctx.arc(x*C+16,y*C+16,v==='o'?7+Math.sin(now/180):2.7,0,Math.PI*2);ctx.fill();if(v==='o'){ctx.lineWidth=1;ctx.strokeStyle='#c5f76a55';ctx.beginPath();ctx.arc(x*C+16,y*C+16,12,0,Math.PI*2);ctx.stroke()}});ctx.shadowBlur=0;
let p=pos(player);ctx.save();ctx.translate(p.x*C+16,p.y*C+16);ctx.rotate(player.dir*Math.PI/2);let mouth=.15+Math.abs(Math.sin(now/100))*.32;ctx.shadowColor=power?'#e3ffac':'#b6f067';ctx.shadowBlur=power?25:13;let grad=ctx.createRadialGradient(-4,-6,0,0,0,15);grad.addColorStop(0,'#f3ffc3');grad.addColorStop(1,'#9cdb43');ctx.fillStyle=grad;if(invincible<=0||Math.sin(now/65)>0){ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,13,mouth,Math.PI*2-mouth);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#24402c';ctx.beginPath();ctx.arc(2,-7,2,0,7);ctx.fill()}ctx.restore();
enemies.forEach((a,i)=>{let p=pos(a),x=p.x*C+16,y=p.y*C+16+Math.sin(now/160+i)*1.2;ctx.save();ctx.translate(x,y);let color=power?'#80a4cc':a.color;ctx.shadowColor=color;ctx.shadowBlur=16;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-14,13);ctx.lineTo(-4,-14);ctx.lineTo(5,-14);ctx.lineTo(14,13);ctx.lineTo(6,13);ctx.lineTo(3,5);ctx.lineTo(-3,5);ctx.lineTo(-6,13);ctx.closePath();ctx.moveTo(-1.5,-1);ctx.lineTo(1.5,-1);ctx.lineTo(0,-7);ctx.closePath();ctx.fill('evenodd');ctx.shadowBlur=0;ctx.strokeStyle='#ffffff75';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-12,11);ctx.lineTo(-3,-12);ctx.lineTo(3,-12);ctx.stroke();ctx.restore()});particles.forEach(a=>{ctx.globalAlpha=Math.max(0,a.life/.6);ctx.fillStyle=a.color;ctx.fillRect(a.x,a.y,3,3)});ctx.globalAlpha=1;
}
function loop(now){let dt=Math.min((now-last)/1000,.035);last=now;if(state==='playing'){power=Math.max(0,power-dt);invincible=Math.max(0,invincible-dt);move(player,dt,8+Math.min(level,8)*.35,true);if(state==='playing'){enemies.forEach(a=>move(a,dt,power?3.8:5.1+Math.min(level,8)*.35,false));let p=pos(player);for(let a of enemies){let q=pos(a);if(Math.hypot(p.x-q.x,p.y-q.y)<.65){if(power){score+=200;burst(q.x,q.y,a.color);Object.assign(a,actor(10,9,a.color));beep(1100,.12)}else if(invincible<=0){lives--;burst(p.x,p.y,'#c5f76a');beep(130,.3);if(!lives){state='over';show('Game over','Je score: '+score+'. Nog een poging?','Probeer opnieuw →')}else resetActors();break}}}update()}}particles.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt});particles=particles.filter(a=>a.life>0);draw(now);requestAnimationFrame(loop)}newLevel();requestAnimationFrame(loop);
