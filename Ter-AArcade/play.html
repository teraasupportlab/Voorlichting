</style><main><div class="top"><a href="index.html">← Ter AArcade</a><span>INSERT FUN. PRESS PLAY.</span></div><div class="machine"><div class="hud"><div><small>SCORE</small><b id="score">0</b></div><h1 id="name"></h1><div><small>RECORD</small><b id="best">0</b></div></div><div class="screen"><canvas id="game" width="480" height="600" aria-label="Arcadespel"></canvas><div class="overlay" id="overlay"><div><h2 id="title"></h2><p id="message"></p><button class="primary" id="start">Spelen →</button></div></div></div><div class="controls"><span id="hint"></span><div><button id="sound" data-arcade-sound>Geluid: aan</button> <button id="pause">Ⅱ Pauze</button></div></div><div class="touch" id="touch"><button class="up" data-key="ArrowUp" aria-label="Omhoog">↑</button><button class="left" data-key="ArrowLeft" aria-label="Links">←</button><button data-key="ArrowDown" aria-label="Omlaag">↓</button><button data-key="ArrowRight" aria-label="Rechts">→</button><button class="fire" data-key="Space">VUREN</button></div></div></main><script src="audio.js"></script><script>
const configs={jumper:{name:'AA Jumper',color:'#6cceff',desc:'Spring over obstakels en verzamel groene Ter AA’s. Spatie, ↑ of tikken = springen. Je kunt twee keer achter elkaar springen.',hint:'Spatie / ↑ / tik = springen · P = pauze'},snake:{name:'Neon Snake',color:'#52e3b0',desc:'Verzamel de Ter AA’s en groei. Raak geen muur of je eigen staart.',hint:'Pijltjes / WASD · P = pauze'},ufo:{name:'UFO Patrol',color:'#ad99ff',desc:'Beweeg links en rechts. Schiet de A-UFO’s neer en ontwijk hun projectielen.',hint:'← → / A D · Spatie = vuren · P = pauze'},breaker:{name:'Block Breaker',color:'#ffb366',desc:'Beweeg het platform en breek alle Ter AA-blokken. Je hebt drie ballen.',hint:'← → / muis · P = pauze'},dodge:{name:'Meteor Rush',color:'#ff7aa6',desc:'Ontwijk de meteorieten. Pak groene Ter AA’s voor bonuspunten.',hint:'← → / muis · P = pauze'}};let type=new URLSearchParams(location.search).get('game');if(!configs[type])type='snake';const cfg=configs[type],$=id=>document.getElementById(id),cv=$('game'),c=cv.getContext('2d');document.documentElement.style.setProperty('--color',cfg.color);document.title=cfg.name+' | Ter AArcade';$('name').textContent=cfg.name;$('title').textContent=cfg.name;$('message').textContent=cfg.desc;$('hint').textContent=cfg.hint;cv.setAttribute('aria-label',cfg.name);if(type!=='snake')document.querySelectorAll('.up,[data-key="ArrowDown"]').forEach(e=>e.style.display='none');if(type!=='ufo'&&type!=='jumper')document.querySelector('.fire').style.display='none';if(type==='jumper'){document.querySelectorAll('[data-key="ArrowLeft"],[data-key="ArrowRight"]').forEach(e=>e.style.display='none');document.querySelector('.fire').textContent='SPRING ↑'}let state='ready',score=0,best=0,keys={},last=0,time=0,spawn=0,shot=0,items=[],bullets=[],enemyShots=[],effects=[],ship,ball,bricks=[],snake,dir,next,food,tick=0,lives=3,wave=1,jumper={y:524,vy:0,jumps:0},bonus=0;try{best=+localStorage.getItem('teraarcade-'+type)||0}catch(e){}$('best').textContent=best;
function unlockAudio(){arcadeSound.unlock()}function soundFX(kind){arcadeSound.fx(kind)}
function stats(){score=Math.floor(score);$('score').textContent=score;if(score>best){best=score;try{localStorage.setItem('teraarcade-'+type,best)}catch(e){}}$('best').textContent=best}
function show(title,text,label='Nog een keer →'){$('title').textContent=title;$('message').textContent=text;$('start').textContent=label;$('overlay').classList.remove('hidden')}
function over(){soundFX('over');state='over';keys={};stats();show('Game over','Je score: '+score+'. Je record: '+best+'.')}
function rand(a,b){return a+Math.random()*(b-a)}function snack(){let free=[];for(let y=0;y<25;y++)for(let x=0;x<20;x++)if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});return free[Math.floor(Math.random()*free.length)]}
function buildBricks(){bricks=[];for(let y=0;y<5;y++)for(let x=0;x<8;x++)bricks.push({x:16+x*57,y:64+y*27,w:50,h:18,color:['#ad99ff','#ff7aa6','#ffb366','#c5f76a','#52e3b0'][y]})}
function reset(){score=0;time=0;spawn=0;shot=0;items=[];bullets=[];enemyShots=[];effects=[];ship={x:240,y:550};lives=3;wave=1;jumper={y:524,vy:0,jumps:0};bonus=0;snake=[{x:10,y:12},{x:9,y:12},{x:8,y:12}];dir={x:1,y:0};next={...dir};tick=0;food=snack();ball={x:240,y:480,vx:170,vy:-245};buildBricks();stats()}
function start(){unlockAudio();if(state!=='paused')reset();state='playing';keys={};$('overlay').classList.add('hidden');$('pause').textContent='Ⅱ Pauze';last=performance.now()}
function pause(){if(state==='playing'){state='paused';keys={};show('Pauze','Klaar voor de volgende ronde?','Verder →');$('pause').textContent='▶ Verder'}else if(state==='paused')start()}
$('start').onclick=start;$('pause').onclick=pause;
function jump(){if(state==='playing'&&jumper.jumps<2){jumper.vy=-490;jumper.jumps++;soundFX('jump');burst(85,jumper.y+10,'#6cceff')}}
function key(k,down){if(k==='p'||k==='P'){if(down)pause();return}const alias={a:'ArrowLeft',d:'ArrowRight',w:'ArrowUp',s:'ArrowDown',' ':'Space'};k=alias[k]||k;keys[k]=down;if(type==='jumper'&&down&&(k==='Space'||k==='ArrowUp'))jump();if(type==='snake'&&down){let v={ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1}}[k];if(v&&!(v.x===-dir.x&&v.y===-dir.y))next=v}}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(!e.repeat)key(e.key,true);if(e.key==='Enter'&&state!=='playing')start()});addEventListener('keyup',e=>key(e.key,false));addEventListener('blur',()=>{if(state==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);key(b.dataset.key,true)};b.onpointerup=b.onpointercancel=()=>key(b.dataset.key,false)});function pointer(e){let r=cv.getBoundingClientRect();ship.x=Math.max(44,Math.min(436,(e.clientX-r.left)*480/r.width))}cv.onpointermove=e=>{if(type!=='snake'&&(e.pointerType==='mouse'||e.buttons))pointer(e)};cv.onpointerdown=e=>{if(type==='jumper'){jump();return}if(type!=='snake'){pointer(e);cv.setPointerCapture(e.pointerId);keys.Space=true}};cv.onpointerup=cv.onpointercancel=()=>keys.Space=false;
function burst(x,y,color){for(let i=0;i<14;i++)effects.push({x,y,vx:rand(-130,130),vy:rand(-130,130),life:.5,color})}
function snakeStep(){dir={...next};let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eat=h.x===food.x&&h.y===food.y;let body=eat?snake:snake.slice(0,-1);if(h.x<0||h.y<0||h.x>=20||h.y>=25||body.some(s=>s.x===h.x&&s.y===h.y)){over();return}snake.unshift(h);if(eat){score+=10;soundFX('eat');burst(h.x*24+12,h.y*24+12,cfg.color);if(snake.length===500){state='over';stats();soundFX('win');show('Perfect gespeeld!','Het hele veld is gevuld. Score: '+score);return}food=snack();stats()}else snake.pop()}
function update(dt){time+=dt;if(type==='jumper'){jumper.vy+=1350*dt;jumper.y+=jumper.vy*dt;if(jumper.y>=524){jumper.y=524;jumper.vy=0;jumper.jumps=0}spawn-=dt;let speed=Math.min(460,240+time*3);if(spawn<=0){let gem=Math.random()<.35;items.push({x:510,y:gem?rand(390,460):550,w:gem?22:rand(24,38),h:gem?22:rand(32,58),gem});spawn=rand(.95,1.5)}for(let a of items){a.x-=speed*dt;let top=a.gem?a.y:a.y-a.h;if(103>a.x&&73<a.x+a.w&&jumper.y+26>top&&jumper.y<a.y+(a.gem?22:0)){if(a.gem){bonus+=50;soundFX('eat');a.dead=true;burst(a.x,a.y,'#c5f76a')}else{over();return}}}items=items.filter(a=>!a.dead&&a.x>-60);score=Math.floor(time*10)+bonus;stats();return}if(type==='snake'){tick+=dt;if(tick>Math.max(.065,.13-score*.00035)){tick=0;snakeStep()}return}ship.x=Math.max(44,Math.min(436,ship.x+((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))*360*dt));
if(type==='ufo'){shot-=dt;spawn-=dt;if(keys.Space&&shot<=0){bullets.push({x:ship.x,y:ship.y-15});soundFX('shot');shot=.16}if(spawn<=0){items.push({x:rand(30,450),y:-25,v:rand(30,55)+time*.55,phase:rand(0,6),cool:rand(1.1,2.8)});spawn=Math.max(.35,1.1-time*.007)}bullets.forEach(b=>b.y-=490*dt);enemyShots.forEach(b=>b.y+=210*dt);for(let a of items){a.y+=a.v*dt;a.x=Math.max(22,Math.min(458,a.x+Math.sin(time*2+a.phase)*40*dt));a.cool-=dt;if(a.cool<0){enemyShots.push({x:a.x,y:a.y+12});a.cool=rand(1.3,3)}if(a.y>580){over();return}for(let b of bullets)if(!a.dead&&!b.dead&&Math.abs(a.x-b.x)<24&&Math.abs(a.y-b.y)<15){a.dead=true;b.dead=true;soundFX('boom');score+=25;burst(a.x,a.y,cfg.color);stats()}}if(enemyShots.some(b=>Math.abs(b.x-ship.x)<17&&Math.abs(b.y-ship.y)<17)||items.some(a=>!a.dead&&Math.hypot(a.x-ship.x,a.y-ship.y)<30)){over();return}items=items.filter(a=>!a.dead);bullets=bullets.filter(b=>!b.dead&&b.y>-10);enemyShots=enemyShots.filter(b=>b.y<620)}
if(type==='dodge'){spawn-=dt;score=Math.floor(time*10);if(spawn<=0){items.push({x:rand(22,458),y:-25,r:rand(12,26),v:rand(150,240)+time*2,gem:Math.random()<.2,rot:rand(0,6)});spawn=Math.max(.16,.48-time*.003)}for(let a of items){a.y+=a.v*dt;a.rot+=dt;if(Math.hypot(a.x-ship.x,a.y-ship.y)<a.r+12){if(a.gem){time+=5;soundFX('eat');a.dead=true;burst(a.x,a.y,'#c5f76a')}else{over();return}}}items=items.filter(a=>!a.dead&&a.y<640);stats()}
if(type==='breaker'){let oldY=ball.y;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<8||ball.x>472){ball.vx*=-1;soundFX('bounce');ball.x=Math.max(8,Math.min(472,ball.x))}if(ball.y<8){ball.vy=Math.abs(ball.vy);soundFX('bounce');ball.y=8}if(ball.vy>0&&oldY<=536&&ball.y>=536&&Math.abs(ball.x-ship.x)<53){ball.vy=-Math.abs(ball.vy);soundFX('bounce');ball.vx=(ball.x-ship.x)*5;ball.y=535}for(let b of bricks){if(ball.x+7>b.x&&ball.x-7<b.x+b.w&&ball.y+7>b.y&&ball.y-7<b.y+b.h){b.dead=true;soundFX('block');ball.vy*=-1;score+=10;burst(ball.x,ball.y,b.color);stats();break}}bricks=bricks.filter(b=>!b.dead);if(ball.y>620){lives--;soundFX('life');if(!lives){over();return}ball={x:ship.x,y:480,vx:170,vy:-245}}if(!bricks.length){soundFX('win');wave++;buildBricks();ball={x:ship.x,y:480,vx:170+wave*10,vy:-245-wave*20};score+=100;stats()}}
}
function glow(color,blur=12){c.fillStyle=color;c.shadowColor=color;c.shadowBlur=blur}function rect(x,y,w,h,r=5){c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}function circle(x,y,r){c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function markA(x,y,size,color='#c5f76a'){c.save();c.shadowColor=color;c.shadowBlur=10;c.fillStyle=color;c.font='900 '+size+'px Arial';c.textAlign='center';c.textBaseline='middle';c.fillText('A',x,y);c.restore()}
function draw(){c.shadowBlur=0;c.fillStyle='#080f1d';c.fillRect(0,0,480,600);c.strokeStyle='#1c2c402f';c.lineWidth=1;for(let x=0;x<480;x+=24){c.beginPath();c.moveTo(x,0);c.lineTo(x,600);c.stroke()}for(let y=0;y<600;y+=24){c.beginPath();c.moveTo(0,y);c.lineTo(480,y);c.stroke()}
if(type==='jumper'){for(let i=0;i<22;i++){c.fillStyle='#9ebcdb55';c.fillRect((i*101-time*20)%500+500>480?((i*101-time*20)%500+500)%500:(i*101-time*20)%500+500,(i*71)%480,2,2)}c.fillStyle='#142b42';for(let i=0;i<10;i++){let x=((i*70-time*45)%700+700)%700-70;rect(x,460-(i%3)*32,45,90+(i%3)*32,3)}glow('#6cceff',8);rect(0,551,480,2,0);items.forEach(a=>{if(a.gem)markA(a.x+11,a.y+11,27,'#c5f76a');else{glow('#ff7aa6',10);rect(a.x,a.y-a.h,a.w,a.h,4);markA(a.x+a.w/2,a.y-a.h/2,Math.min(a.w,24),'#351b31')}});glow(cfg.color,18);rect(73,jumper.y,30,27,6);markA(88,jumper.y+14,23,'#0c2540');c.shadowBlur=0;c.fillStyle='#7d99b8';c.font='11px Arial';c.fillText('DUBBELE SPRONG · '+(2-jumper.jumps)+' OVER',18,28)}else if(type==='snake'){glow('#ffb366',18);markA(food.x*24+12,food.y*24+12,22,'#c5f76a');snake.forEach((s,i)=>{glow(i?'#36b38b':cfg.color,i?5:15);rect(s.x*24+2,s.y*24+2,20,20,5)});glow('#102a29',0);let h=snake[0];circle(h.x*24+12+dir.x*5-dir.y*4,h.y*24+12+dir.y*5-dir.x*4,2);circle(h.x*24+12+dir.x*5+dir.y*4,h.y*24+12+dir.y*5+dir.x*4,2)}else{if(type==='ufo'||type==='dodge'){for(let i=0;i<45;i++){c.fillStyle=i%3?'#8799b94f':'#cddcff';c.fillRect((i*107)%480,(i*157+time*(15+i%4*8))%600,1.5,1.5)}glow(cfg.color);c.beginPath();c.moveTo(ship.x,ship.y-20);c.lineTo(ship.x+17,ship.y+15);c.lineTo(ship.x,ship.y+7);c.lineTo(ship.x-17,ship.y+15);c.closePath();c.fill();markA(ship.x,ship.y+1,16,'#101b31');glow('#d7f5ff');rect(ship.x-3,ship.y+16,6,8+Math.sin(time*25)*4,2)}
if(type==='ufo'){items.forEach(a=>{glow(cfg.color,16);c.beginPath();c.ellipse(a.x,a.y,23,8,0,0,7);c.fill();glow('#d1efff',7);c.beginPath();c.ellipse(a.x,a.y-7,11,9,0,Math.PI,Math.PI*2);c.fill();glow('#111c35',0);rect(a.x-18,a.y-1,36,3,1);markA(a.x,a.y-6,17,'#c5f76a')});glow('#c5f76a');bullets.forEach(b=>rect(b.x-2,b.y,4,14,2));glow('#ff7aa6');enemyShots.forEach(b=>circle(b.x,b.y,4))}
if(type==='dodge')items.forEach(a=>{c.save();c.translate(a.x,a.y);c.rotate(a.rot);glow(a.gem?'#c5f76a':'#ff7aa6',a.gem?18:7);c.beginPath();for(let i=0;i<(a.gem?4:7);i++){let n=a.gem?4:7,ang=i/n*Math.PI*2,r=a.r*(a.gem?1:i%2?.8:1);let x=Math.cos(ang)*r,y=Math.sin(ang)*r;i?c.lineTo(x,y):c.moveTo(x,y)}c.closePath();if(a.gem){c.shadowBlur=0;markA(0,0,a.r*1.8,'#c5f76a')}else{c.strokeStyle='#ff7aa6';c.lineWidth=2;c.fillStyle='#3d2035';c.fill();c.stroke()}c.restore()});
if(type==='breaker'){bricks.forEach(b=>{glow(b.color,7);rect(b.x,b.y,b.w,b.h,4);markA(b.x+b.w/2,b.y+b.h/2+1,15,'#102033')});glow(cfg.color);rect(ship.x-46,545,92,10,5);c.save();c.shadowBlur=0;c.fillStyle='#142131';c.font='bold 9px Arial';c.textAlign='center';c.fillText('Ter AA',ship.x,553);c.restore();glow('#fff',15);circle(ball.x,ball.y,7);c.shadowBlur=0;c.fillStyle='#899bb7';c.font='11px Arial';c.fillText('BALLEN '+ '● '.repeat(lives),18,28);c.fillText('RONDE '+wave,390,28)}}effects.forEach(e=>{c.globalAlpha=Math.max(0,e.life*2);glow(e.color,5);c.fillRect(e.x,e.y,3,3)});c.globalAlpha=1;c.shadowBlur=0}
function frame(now){let dt=Math.min(.025,(now-last)/1000||0);last=now;if(state==='playing'){update(dt);effects.forEach(e=>{e.x+=e.vx*dt;e.y+=e.vy*dt;e.life-=dt});effects=effects.filter(e=>e.life>0)}draw();requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
